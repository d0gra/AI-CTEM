groups:
  - name: ctem
    rules:
      - alert: CtemApiErrorRate
        expr: sum(rate(ctem_http_requests_total{status=~"5.."}[5m])) / sum(rate(ctem_http_requests_total[5m])) > 0.05
        for: 10m
        labels: { severity: page }
        annotations: { summary: "More than 5% of API requests are failing" }
      - alert: CtemApiLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(ctem_http_request_duration_seconds_bucket[5m]))) > 2
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "API p95 latency above 2s" }
      - alert: CtemJobsDeadLettered
        expr: increase(ctem_jobs_total{outcome="dead"}[1h]) > 0
        labels: { severity: ticket }
        annotations: { summary: "Background jobs exhausted their retries in the last hour" }
      - alert: CtemWorkerDown
        expr: absent(up{job="ctem-worker"} == 1)
        for: 5m
        labels: { severity: page }
        annotations: { summary: "No worker is running; assessments and notifications are not being processed" }
      - alert: CtemAuthFailuresSpike
        expr: sum(rate(ctem_http_requests_total{route="/api/v1/auth/login",status="401"}[5m])) > 1
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Sustained failed sign-ins (possible credential stuffing)" }
