# Reference manifests for the released image, ghcr.io/d0gra/ai-ctem. One image runs every role; the
# role is the command, so these manifests differ only in `args` and in how many replicas they run.
# Create the Secret from your secret manager, then: kubectl apply -f infrastructure/kubernetes/
# PostgreSQL and Redis are expected as managed services or separately operated workloads.
apiVersion: v1
kind: Namespace
metadata:
  name: ctem
  labels: { pod-security.kubernetes.io/enforce: restricted }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: ctem-config, namespace: ctem }
data:
  CTEM_ENV: production
  CTEM_COOKIE_SECURE: "true"
  CTEM_PUBLIC_BASE_URL: https://ctem.example.com
  CTEM_ALLOW_REGISTRATION: "false"
  CTEM_STORAGE_BACKEND: s3
  CTEM_S3_BUCKET: ctem-evidence
  CTEM_LOG_JSON: "true"
  # The Ingress controller appends the real client address to X-Forwarded-For.
  CTEM_UPSTREAM_PROXY: "true"
  CTEM_TRUSTED_PROXIES: 10.0.0.0/8
---
# Example only: create this from a secret manager (External Secrets, Sealed Secrets, CSI driver).
apiVersion: v1
kind: Secret
metadata: { name: ctem-secrets, namespace: ctem }
type: Opaque
stringData:
  CTEM_SECRET_KEY: REPLACE_ME
  CTEM_ENCRYPTION_KEYS: REPLACE_ME
  CTEM_DATABASE_URL: postgresql+psycopg://ctem_app:REPLACE_ME@postgres:5432/ctem
  CTEM_MIGRATION_DATABASE_URL: postgresql+psycopg://ctem_owner:REPLACE_ME@postgres:5432/ctem
  CTEM_REDIS_URL: redis://redis:6379/0
---
# Run before every upgrade, and wait for it to complete before the Deployments roll.
apiVersion: batch/v1
kind: Job
metadata: { name: ctem-migrate, namespace: ctem }
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: ghcr.io/d0gra/ai-ctem:0.3.0
          args: ["migrate"]
          envFrom: [{ configMapRef: { name: ctem-config } }, { secretRef: { name: ctem-secrets } }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
# The request tier: the web server and the API in one pod. They are always co-located, because the
# browser talks only to the web server and its /api/* proxy destination is fixed when the image is built.
apiVersion: apps/v1
kind: Deployment
metadata: { name: ctem, namespace: ctem }
spec:
  replicas: 2
  selector: { matchLabels: { app: ctem } }
  template:
    metadata:
      labels: { app: ctem }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: ctem
          image: ghcr.io/d0gra/ai-ctem:0.3.0
          args: ["serve"]   # web and API; background jobs run in the worker Deployment below
          ports: [{ name: web, containerPort: 3000 }, { name: api, containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: ctem-config } }, { secretRef: { name: ctem-secrets } }]
          readinessProbe: { httpGet: { path: /readyz, port: api }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: api }, periodSeconds: 20 }
          startupProbe: { httpGet: { path: /login, port: web }, periodSeconds: 5, failureThreshold: 24 }
          resources: { requests: { cpu: 400m, memory: 640Mi }, limits: { memory: 1536Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: cache, mountPath: /app/web/.next/cache }, { name: tmp, mountPath: /tmp }]
      volumes: [{ name: cache, emptyDir: {} }, { name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: ctem }
spec:
  selector: { app: ctem }
  ports: [{ port: 80, targetPort: web }]
---
# Background jobs. Scaled on its own: claiming is safe under concurrency (FOR UPDATE SKIP LOCKED) and
# the scheduler tick is serialised across processes with a PostgreSQL advisory lock.
apiVersion: apps/v1
kind: Deployment
metadata: { name: ctem-worker, namespace: ctem }
spec:
  replicas: 2
  selector: { matchLabels: { app: ctem-worker } }
  template:
    metadata:
      labels: { app: ctem-worker }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9108" }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: ghcr.io/d0gra/ai-ctem:0.3.0
          args: ["worker"]
          env: [{ name: CTEM_WORKER_METRICS_PORT, value: "9108" }]
          envFrom: [{ configMapRef: { name: ctem-config } }, { secretRef: { name: ctem-secrets } }]
          ports: [{ containerPort: 9108 }]
          resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { memory: 2Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ctem
  namespace: ctem
spec:
  tls: [{ hosts: [ctem.example.com], secretName: ctem-tls }]
  rules:
    - host: ctem.example.com
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }]
---
# Only the web port is reachable from the cluster. The API port is open inside the pod, where the web
# server proxies to it over loopback; nothing else should reach it. Add a rule here for your monitoring
# namespace if Prometheus scrapes /metrics on 8000, or set CTEM_API_BIND=127.0.0.1 to close it entirely
# (which also stops the scrape).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: ctem-ingress, namespace: ctem }
spec:
  podSelector: { matchLabels: { app: ctem } }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 3000 }]
