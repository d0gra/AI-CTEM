# Publishes the product page in site/ to GitHub Pages: https://d0gra.github.io/AI-CTEM/
# The page is static and has no build step. Pages itself had to be enabled once by a repository
# administrator (Settings -> Pages -> Source: GitHub Actions); the workflow token is not allowed to do it.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions: { contents: read }

# One deployment at a time, and never cancel one half-done.
concurrency: { group: pages, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
