# Publishes the aictem CLI to PyPI when a tag like cli-v0.1.0 is pushed.
#
# Authentication uses PyPI trusted publishing (OpenID Connect): GitHub proves the workflow's identity
# and PyPI issues a short-lived token, so no API token is stored in this repository. Configure the
# publisher once on PyPI before the first release; see cli/README.md -> Releasing.
name: Release CLI

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check only, without publishing
        type: boolean
        default: true

permissions: { contents: read }

defaults: { run: { working-directory: cli } }

jobs:
  verify:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: { python: ["3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python ${{ matrix.python }} --with pytest pytest -q
      - run: uvx ruff check .
        if: matrix.python == '3.12'

  build:
    name: Build distribution
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check the tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(uv run --no-project python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#cli-v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag cli-v$tag does not match project version $version; update cli/pyproject.toml or retag"
            exit 1
          fi
      - id: version
        run: echo "version=$(uv run --no-project python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")" >> "$GITHUB_OUTPUT"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the built wheel and run it
        run: |
          uv run --isolated --no-project --with ./dist/aictem-${{ steps.version.outputs.version }}-py3-none-any.whl aictem --version
          uv run --isolated --no-project --with ./dist/aictem-${{ steps.version.outputs.version }}-py3-none-any.whl aictem discover .. --fail-on none
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: cli/dist/, if-no-files-found: error }

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aictem/${{ needs.build.outputs.version }}
    permissions:
      id-token: write  # required for trusted publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: dist/, print-hash: true }

  github-release:
    name: GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          name: aictem ${{ needs.build.outputs.version }}
          body: |
            `aictem` ${{ needs.build.outputs.version }} is on PyPI.

            ```bash
            pipx install aictem    # or: uv tool install aictem
            aictem discover .
            ```

            See the [changelog](https://github.com/d0gra/AI-CTEM/blob/main/CHANGELOG.md).
