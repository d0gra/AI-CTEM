name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      CTEM_TEST_APP_URL: postgresql+psycopg://ctem_app:ctem_app_dev@127.0.0.1:5432/ctem_test
      CTEM_TEST_OWNER_URL: postgresql+psycopg://ctem_owner:ctem_owner_dev@127.0.0.1:5432/ctem_test
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create database roles
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ctem_owner LOGIN PASSWORD 'ctem_owner_dev';
          CREATE ROLE ctem_app LOGIN PASSWORD 'ctem_app_dev' NOSUPERUSER NOBYPASSRLS;
          CREATE DATABASE ctem_test OWNER ctem_owner;
          SQL
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nmap
      - run: uv sync --frozen
      - run: uv run ruff check .
      - name: Type check (advisory until the remaining findings are cleared)
        run: uv run mypy app
        continue-on-error: true
      - name: Migration is in sync with the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
        env:
          CTEM_MIGRATION_DATABASE_URL: ${{ env.CTEM_TEST_OWNER_URL }}
      - run: uv run pytest --cov=app --cov-report=term-missing:skip-covered
      - name: Dependency vulnerabilities
        run: uvx pip-audit --strict --requirement <(uv export --frozen --no-dev --no-hashes --no-emit-project)

  cli:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cli } }
    strategy:
      matrix: { python: ["3.11", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --python ${{ matrix.python }} --with pytest pytest -q
      - name: Scan this repository with the CLI
        run: uv run --python ${{ matrix.python }} aictem discover .. --format sarif --output aictem.sarif

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Every component declares the same version
        run: python3 scripts/check_versions.py
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Static analysis
        run: pipx run semgrep scan --config p/default --error --metrics off backend/app frontend/app frontend/components frontend/lib cli/src

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write  # publish the verified image from main; see the last steps
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      # image.source is what links the package to this repository on GitHub, so it inherits the
      # repository's visibility and permissions instead of being an orphan package on the account.
      LABELS: >-
        --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        --label org.opencontainers.image.revision=${{ github.sha }}
        --label org.opencontainers.image.licenses=MIT
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build $LABELS -t ctem:ci .
      - name: Database for it to talk to
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ctem_owner LOGIN PASSWORD 'owner_ci';
          CREATE ROLE ctem_app LOGIN PASSWORD 'app_ci' NOSUPERUSER NOBYPASSRLS;
          CREATE DATABASE ctem OWNER ctem_owner;
          SQL
      - name: Every role of the production image works
        run: |
          set -eux
          keys=$(docker run --rm ctem:ci python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          cat > /tmp/ctem.env <<EOF
          CTEM_ENV=production
          CTEM_DATABASE_URL=postgresql+psycopg://ctem_app:app_ci@127.0.0.1:5432/ctem
          CTEM_MIGRATION_DATABASE_URL=postgresql+psycopg://ctem_owner:owner_ci@127.0.0.1:5432/ctem
          CTEM_SECRET_KEY=$(openssl rand -hex 32)
          CTEM_ENCRYPTION_KEYS=$keys
          CTEM_COOKIE_SECURE=false
          EOF

          docker run --rm --network host --env-file /tmp/ctem.env ctem:ci migrate

          docker run -d --name prod --network host --env-file /tmp/ctem.env ctem:ci all
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3000/login && break; sleep 2; done
          docker logs prod
          curl -sf -o /dev/null http://127.0.0.1:8000/healthz                     # the API answers
          curl -sf -o /dev/null http://127.0.0.1:3000/login                       # the web tier serves
          # 401 rather than 502: the web tier really is proxying /api/* to the API in the same container.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/v1/auth/me)" = 401
          docker logs prod 2>&1 | grep -q "\[ctem .*\] worker"                  # the worker started too
          docker rm -f prod

          docker run -d --name worker --network host --env-file /tmp/ctem.env ctem:ci worker
          sleep 15
          docker ps --filter name=worker --filter status=running --format '{{.Names}}' | grep -qx worker
          docker rm -f worker

          ! docker run --rm ctem:ci not-a-role                                    # an unknown role fails
          docker run --rm --network host --env-file /tmp/ctem.env ctem:ci python -c "import app.main"  # a command still runs

      # The demo image is built and tested here but never published: it bundles PostgreSQL and seeds
      # shared accounts, and Render builds it from this repository itself.
      - name: Build the demo image
        run: docker build $LABELS -f Dockerfile.demo -t ctem/demo:ci .
      - name: Start the demo image
        run: |
          # A higher sign-in limit for the browser tests, which sign in as several roles from one address.
          docker run -d --name demo -p 10000:10000 -e CTEM_RATE_LIMIT_AUTH=200 -e CTEM_WORKER_START_DELAY_SECONDS=5 ctem/demo:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:10000/api/v1/demo > demo.json && break; sleep 3; done
          docker logs demo | tail -40
          python3 -c "import json; d = json.load(open('demo.json')); assert len(d['accounts']) == 9, d"
          curl -sf -o /dev/null http://127.0.0.1:10000/login
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: Browser tests against the running demo
        working-directory: frontend
        env: { E2E_BASE_URL: "http://localhost:10000" }
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - name: Demo log, if the browser tests failed
        if: failure()
        run: docker logs demo | tail -200
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report/, retention-days: 7 }

      # Publishing is the last thing the job does, so only an image whose every role started and whose
      # product passed the browser tests is pushed. Pull requests do not publish: one from a fork must
      # not be handed a token that can write packages.
      #
      # One package, `ai-ctem`, tagged `main` and `sha-<commit>`. A production deployment should use a
      # released version instead (release.yml, a v* tag), which also carries provenance and an SBOM;
      # `latest` is published there and never moved by this job.
      - name: Publish the verified image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image=$(echo "ghcr.io/${{ github.repository_owner }}/ai-ctem" | tr '[:upper:]' '[:lower:]')
          docker tag ctem:ci "$image:main"
          docker tag ctem:ci "$image:sha-$(echo "$GITHUB_SHA" | cut -c1-12)"
          docker push --all-tags "$image"
