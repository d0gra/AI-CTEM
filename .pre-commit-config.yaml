repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - { id: ruff, args: [--fix], files: ^backend/ }
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks: [{ id: gitleaks }]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - { id: check-yaml, args: [--allow-multiple-documents] }
      - { id: end-of-file-fixer }
      - { id: check-added-large-files, args: [--maxkb=500] }
  - repo: local
    hooks:
      - { id: frontend-lint, name: frontend lint, entry: sh -c 'cd frontend && pnpm lint', language: system, files: ^frontend/, pass_filenames: false }
