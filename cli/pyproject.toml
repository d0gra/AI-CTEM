[project]
name = "ctem-cli"
version = "0.1.0"
description = "Discover repository, dependency, container, cloud and AI assets and send them to the CTEM platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []  # standard library only, so it runs in any CI image
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
ctem = "ctem_cli.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctem_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py311"
