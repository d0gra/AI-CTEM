# Render Blueprint for the public demo (Dashboard → New → Blueprint → this repository).
# One Docker web service running Dockerfile.demo: PostgreSQL, API, worker and web in a single container.
# Data is not persistent; each deploy or restart starts a clean demo. See docs/demo.md.
services:
  - type: web
    name: ctem-demo
    runtime: docker
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    # Fits the free plan (512 MB): the worker runs inside the API process and PostgreSQL is tuned down.
    # Measured peak under load is about 370 MB. Free instances sleep when idle, and waking one starts a
    # clean demo, which takes a minute or two on the free plan's CPU share.
    plan: free
    # The sign-in page is served by the web tier, which starts first; the API follows within minutes on
    # the free plan's CPU share. Checking an API path here made slow cold starts fail the deploy.
    healthCheckPath: /login
    envVars:
      - key: CTEM_DEMO_MODE
        value: "true"
      # Shared password for every demo account, shown on the sign-in page. Change it here if you like.
      - key: CTEM_DEMO_PASSWORD
        value: Demo-CTEM-2026!
      # Set to "false" for an empty demo organization without the analysed sample repository.
      - key: CTEM_DEMO_SAMPLE_DATA
        value: "true"
      # Feeds synchronised at start. Add ",mitre_attack" for ATT&CK (a 45 MB download; slower start).
      - key: CTEM_DEMO_INTEL_SOURCES
        value: cisa_kev,epss,mitre_atlas
